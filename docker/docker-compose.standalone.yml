# Standalone / Single-user local RPA compose override.
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.standalone.yml up -d
services:
  openresty-nginx:
    environment:
      - RPA_HTTP_BIND_ADDRESS=127.0.0.1
      - RPA_HTTPS_BIND_ADDRESS=127.0.0.1
      - CASDOOR_HTTP_BIND_ADDRESS=127.0.0.1
      - CASDOOR_HTTPS_BIND_ADDRESS=127.0.0.1
      - AUTH_ENABLED=false
    ports: !override
      - "127.0.0.1:${RPA_HTTP_PORT:-32742}:80"
      - "127.0.0.1:${RPA_HTTPS_PORT:-443}:443"

  robot-service:
    environment:
      - AUTH_ENABLED=false
      - AUTH_BASE_URL=http://localhost:8040/api/robot

  openapi-service:
    environment:
      - STORAGE_DRIVER=local

  rpa-auth:
    profiles: ["multi-tenant"]

  casdoor:
    profiles: ["multi-tenant"]
